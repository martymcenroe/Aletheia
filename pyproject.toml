[tool.poetry]
name = "aletheia"
version = "0.1.0"
description = "Context-aware browser extension backend using pure Python on AWS Lambda."
authors = ["Marty McEnroe"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "^1.43"
pillow = "^12.3.0"
tzdata = "^2026.3"
pywin32 = {version = "^312", markers = "sys_platform == 'win32'"}
requests = "^2.34.2"
beautifulsoup4 = "^4.15.0"
colorama = "^0.4.6"
aws-xray-sdk = "^2.14.0"  # Issue #7: Observability tracing
stripe = ">=15.5.0,<16.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"
responses = ">=0.26.2,<0.27.0"
pytest-cov = ">=7.1.0,<8.0.0"
pytest-benchmark = ">=5.1.0,<6.0.0"  # Issue #161: Performance benchmarks
ruff = ">=0.16.3,<0.17.0"
mypy = ">=2.3.0,<3.0.0"
pre-commit = ">=4.6.2,<5.0.0"
types-requests = ">=2.33.0.20260712,<3.0.0.0"
types-colorama = "^0.4.15.20260508"
pyjwt = "^2.13.0"
moto = "^5.2.2"


[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/compliance",
    "tests/tools",
    "tests/benchmark",
]
markers = [
    "live: tests that hit real websites (may be slow/flaky)",
    "audit: compliance tests requiring AWS credentials (runs nightly)",
    "unit: unit tests for Python modules",
    "tools: tests for CLI tools",
    "benchmark: performance benchmark tests (Issue #161)",
]
# Issue #817: live tests assert against third parties' CURRENT robots.txt, so
# they fail for reasons outside this repository — and a suite that is red for
# external reasons stops being a signal. TestLiveWebsites was already marked
# `live`, and its docstring already said to run it with `-m live`; nothing
# enforced that, so it fired on every default run. Opt in explicitly:
#
#     poetry run pytest -m live
#
# A CLI `-m` overrides this (later occurrence wins), so CI's existing
# `-m "not audit"` is unaffected and still exercises the live checks.
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
line-length = 120  # Match existing code style

[tool.ruff.lint]
# Security: "S" = flake8-bandit rules (per ADR 0213)
# Added to catch Python security anti-patterns like:
# - S101: assert used in production
# - S105-S108: hardcoded passwords/secrets
# - S301-S302: pickle usage
# - S310-S312: suspicious imports
# - S501-S509: request without SSL verification
select = ["E", "F", "W", "S"]
ignore = [
    # S101: We use assert in tests intentionally
    "S101",
    # E501: Line length - existing code exceeds 88, defer to 120
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Allow assert and test-fixture secrets in test files
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S110", "S310"]
# Allow subprocess in tool tests (we control the input - test harness pattern)
"tests/tools/**/*.py" = ["S603"]
# Allow subprocess in print tools (internal developer tools, hardcoded commands)
"tools/print/**/*.py" = ["S603"]
# S105 false positive: URLs containing "Token" are flagged as passwords
"src/lambda_auth_function.py" = ["S105"]
"src/auth/linkedin_oauth.py" = ["S105"]
"src/auth/token_manager.py" = ["S105"]
"src/auth/auth_middleware.py" = ["S105"]
# E402: imports after sys.path.insert for src/ access
"tests/integration/test_auth_flow.py" = ["S101", "S105", "S106", "E402"]
"tools/admin_token_cap.py" = ["E402"]
# Smoke test intentionally uses subprocess for AWS CLI and opens URLs from CLI args
"tools/smoke_test.py" = ["S603", "S607", "S310"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "aws_xray_sdk",
    "aws_xray_sdk.*",
]
ignore_missing_imports = true
