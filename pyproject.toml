[tool.poetry]
name = "aletheia"
version = "0.1.0"
description = "Context-aware browser extension backend using LangGraph on AWS Lambda."
authors = ["Marty McEnroe"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "^1.34"
langchain = "^0.1"
langchain-aws = "^0.1"
langgraph = "^0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
