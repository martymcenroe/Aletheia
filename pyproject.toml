[tool.poetry]
name = "aletheia"
version = "0.1.0"
description = "Context-aware browser extension backend using pure Python on AWS Lambda."
authors = ["Marty McEnroe"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "^1.34"
pillow = "^12.1.0"
tzdata = "^2025.3"
pywin32 = {version = "^311", markers = "sys_platform == 'win32'"}
requests = "^2.32.5"
beautifulsoup4 = "^4.14.3"
colorama = "^0.4.6"
aws-xray-sdk = "^2.14.0"  # Issue #7: Observability tracing

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.1,<10.0.0"
responses = ">=0.25.8,<0.26.0"
pytest-cov = ">=7.0.0,<8.0.0"
pytest-benchmark = ">=5.1.0,<6.0.0"  # Issue #161: Performance benchmarks
ruff = ">=0.14.10,<0.15.0"
mypy = ">=1.19.1,<2.0.0"
pre-commit = ">=4.5.1,<5.0.0"
types-requests = ">=2.32.4.20250913,<3.0.0.0"
types-colorama = "^0.4.15.20250801"

[tool.pytest.ini_options]
testpaths = [
    "tests/unit",
    "tests/compliance",
    "tests/tools",
    "tests/benchmark",
]
markers = [
    "live: tests that hit real websites (may be slow/flaky)",
    "audit: compliance tests requiring AWS credentials (runs nightly)",
    "unit: unit tests for Python modules",
    "tools: tests for CLI tools",
    "benchmark: performance benchmark tests (Issue #161)",
]

[tool.ruff]
target-version = "py312"
line-length = 120  # Match existing code style

[tool.ruff.lint]
# Security: "S" = flake8-bandit rules (per ADR 0213)
# Added to catch Python security anti-patterns like:
# - S101: assert used in production
# - S105-S108: hardcoded passwords/secrets
# - S301-S302: pickle usage
# - S310-S312: suspicious imports
# - S501-S509: request without SSL verification
select = ["E", "F", "W", "S"]
ignore = [
    # S101: We use assert in tests intentionally
    "S101",
    # E501: Line length - existing code exceeds 88, defer to 120
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Allow assert in test files
"tests/**/*.py" = ["S101"]
# Allow subprocess in tool tests (we control the input - test harness pattern)
"tests/tools/**/*.py" = ["S603"]
# Allow subprocess in print tools (internal developer tools, hardcoded commands)
"tools/print/**/*.py" = ["S603"]
# S105 false positive: URLs containing "Token" are flagged as passwords
"src/lambda_auth_function.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "aws_xray_sdk",
    "aws_xray_sdk.*",
]
ignore_missing_imports = true
