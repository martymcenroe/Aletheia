[tool.poetry]
name = "aletheia"
version = "0.1.0"
description = "Context-aware browser extension backend using pure Python on AWS Lambda."
authors = ["Marty McEnroe"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "^1.34"
pillow = "^12.0.0"
tzdata = "^2025.3"
pywin32 = {version = "^311", markers = "sys_platform == 'win32'"}
requests = "^2.32.5"
beautifulsoup4 = "^4.14.3"
colorama = "^0.4.6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "responses (>=0.25.8,<0.26.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "ruff (>=0.14.10,<0.15.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "types-requests (>=2.32.4.20250913,<3.0.0.0)"
]

[tool.pytest.ini_options]
markers = [
    "live: tests that hit real websites (may be slow/flaky)",
]
