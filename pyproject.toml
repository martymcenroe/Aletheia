[tool.poetry]
name = "aletheia"
version = "0.1.0"
description = "Context-aware browser extension backend using pure Python on AWS Lambda."
authors = ["Marty McEnroe"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
boto3 = "^1.34"
pillow = "^12.0.0"
tzdata = "^2025.3"
pywin32 = "^311"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)"
]
