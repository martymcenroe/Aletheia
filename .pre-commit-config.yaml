repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        args: [--ignore-missing-imports]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks

  # ESLint for JavaScript (security plugins: no-unsanitized, security)
  # See: docs/9000-lessons-learned.md (2026-01-08) - JS was second-class citizen
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (JS Security)
        entry: npx eslint --max-warnings 0
        language: system
        files: \.(js|mjs)$
        types: [file]

  # Project Policy Compliance (ADRs, CLAUDE.md directives)
  # See: docs/9000-lessons-learned.md (2026-01-04)
  - repo: local
    hooks:
      - id: policy-check
        name: Project Policy Compliance
        entry: bash tools/policy_check.sh
        language: system
        pass_filenames: false
        always_run: true
