repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        args: [--ignore-missing-imports]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.1
    hooks:
      - id: gitleaks

  # ESLint for JavaScript (security plugins: no-unsanitized, security)
  # See: docs/9000-lessons-learned.md (2026-01-08) - JS was second-class citizen
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (JS Security)
        entry: npx eslint --max-warnings 0
        language: system
        files: \.(js|mjs)$
        types: [file]

  # Project Policy Compliance (ADRs, CLAUDE.md directives)
  # See: docs/9000-lessons-learned.md (2026-01-04)
  - repo: local
    hooks:
      - id: policy-check
        name: Project Policy Compliance
        entry: bash tools/policy_check.sh
        language: system
        pass_filenames: false
        always_run: true

  # PRE-MERGE GATE: Require reports before committing implementation code
  # See: docs/9000-lessons-learned.md (2026-01-09) - gate violations #53, #147, #126
  # "Documentation doesn't change behavior. Technical enforcement required."
  - repo: local
    hooks:
      - id: report-gate
        name: PRE-MERGE GATE (Reports Required)
        entry: bash tools/report_gate.sh
        language: system
        pass_filenames: false
        always_run: true

  # Audit Record Compliance: Auditor identity and FAIL→issue requirements
  # See: docs/0800-audit-index.md Section 8 - Audit Record Requirements
  # Issues: #249 (auditor identity), #253 (FAIL→issue)
  - repo: local
    hooks:
      - id: audit-record-check
        name: Audit Record Compliance
        entry: python tools/audit_record_check.py
        language: system
        pass_filenames: false
        files: ^docs/08.*-audit-.*\.md$
