# Issue #448: Generate Linux visual regression baselines
#
# Generates Linux-specific screenshot baselines for visual regression tests.
# Must run on ubuntu-latest to match CI runner (font rendering is distro-specific).
# Manual trigger only — run after Playwright upgrades or ubuntu-latest image changes.

name: Generate Visual Baselines (Linux)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to generate baselines on (default: main)'
        required: false
        default: 'main'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Cache Playwright binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Install Chromium OS dependencies
        run: npx playwright install-deps chromium

      - name: Generate Linux baselines
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" \
            npx playwright test tests/e2e/visual-poc.spec.js \
              --project=chromium \
              --headed \
              --update-snapshots \
              --reporter=list

      - name: Verify baselines were created
        run: |
          SNAPSHOT_DIR="tests/e2e/__snapshots__/visual-poc.spec.js-snapshots"
          EXPECTED_FILES=(
            "test-fixture-header-chromium-linux.png"
            "test-fixture-fullpage-chromium-linux.png"
            "page-with-extension-chromium-linux.png"
          )
          MISSING=0
          for f in "${EXPECTED_FILES[@]}"; do
            if [ -f "$SNAPSHOT_DIR/$f" ]; then
              echo "✓ $f ($(stat -c%s "$SNAPSHOT_DIR/$f") bytes)"
            else
              echo "✗ MISSING: $f"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ $MISSING -gt 0 ]; then
            echo ""
            echo "ERROR: $MISSING baseline(s) missing. Listing snapshot dir:"
            ls -la "$SNAPSHOT_DIR/" || echo "(directory does not exist)"
            exit 1
          fi
          echo ""
          echo "All 3 Linux baselines generated successfully."

      - name: Create branch and commit baselines
        run: |
          BRANCH_NAME="visual-baselines/linux-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add tests/e2e/__snapshots__/
          git commit -m "feat: add Linux visual regression baselines (ref #448)"
          git push origin "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "feat: add Linux visual regression baselines" \
            --body "$(cat <<'EOF'
          ## Summary

          - Generated Linux (`ubuntu-latest`) visual regression baselines for Issue #173
          - 3 new baseline PNGs: header, fullpage, page-with-extension
          - Visual tests will no longer skip on Linux CI after merge

          ## Generated by

          `workflow_dispatch` → `.github/workflows/visual-baselines.yml`

          Refs: #448

          🤖 Generated with [GitHub Actions](https://github.com/martymcenroe/Aletheia/actions)
          EOF
          )" \
            --base "${{ github.event.inputs.branch }}"

      - name: Upload baselines as artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-visual-baselines
          path: tests/e2e/__snapshots__/visual-poc.spec.js-snapshots/*-chromium-linux.png
          retention-days: 30
