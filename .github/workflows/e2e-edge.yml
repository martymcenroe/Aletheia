# Issue #263: Edge E2E Test Matrix
# See: docs/lld/active/1263-edge-e2e-test-matrix.md
#
# Runs E2E tests against Microsoft Edge to verify Chrome extension compatibility.
# Uses warn-only mode initially (continue-on-error: true) until baseline is established.
# After baseline: remove continue-on-error to make Edge failures block PRs.
#
# Note: Extension is unpacked (no build step needed). Extension loads from extensions/chrome/.

name: E2E Tests (Edge)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Prevent stalled browser hangs
    # Warn-only initially - remove after baseline established
    continue-on-error: true  # ref #455 — remove after exit criteria met

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Install Edge browser
        run: npx playwright install msedge

      - name: Install Edge OS dependencies
        run: npx playwright install-deps msedge

      - name: Run E2E tests (Edge)
        # xvfb-run required for headed mode (extensions require headless: false)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test --project=edge

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-edge
          path: playwright-report/
          retention-days: 7
