name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Run linting
        run: poetry run ruff check src/ tests/

      - name: Run type checking
        run: poetry run mypy src/ --ignore-missing-imports

      - name: Run tests with coverage
        run: poetry run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  extension-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Chrome extension
        run: npx eslint@8 extension-chrome-V3/ --ext .js

      - name: Lint Firefox extension
        run: npx eslint@8 extension-firefox-V2/ --ext .js
