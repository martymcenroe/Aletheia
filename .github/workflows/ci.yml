name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly compliance audit at midnight UTC
    - cron: '0 0 * * *'

jobs:
  # Dependency security review - runs on PRs only
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Allow licenses compatible with MIT
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense

  # Policy compliance runs FIRST - blocks all other jobs if failed
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run policy compliance check
        run: ./tools/policy_check.sh

  # Shell script linting - catch bash syntax errors before merge
  infra-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck on provision.sh
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          additional_files: 'provision.sh'

      - name: Run ShellCheck on tools/
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './tools'

  test:
    needs: policy-check  # Only run if policy check passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Run linting
        run: poetry run ruff check src/ tests/

      - name: Run type checking
        run: poetry run mypy src/ --ignore-missing-imports

      - name: Run tests with coverage (excluding audit tests)
        run: poetry run pytest tests/ -v -m "not audit" --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  extension-lint:
    needs: policy-check  # Only run if policy check passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint Chrome extension
        run: npx eslint extensions/chrome/

      - name: Lint Firefox extension
        run: npx eslint extensions/firefox/

  # Infrastructure deployment - runs ONLY on push to main
  deploy-infra:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, policy-check]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deploy Infrastructure
        run: ./provision.sh

  # Compliance audit - runs on push to main AND nightly schedule
  # Requires AWS credentials to verify Bedrock configuration
  compliance-audit:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: policy-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run compliance audit tests
        run: poetry run pytest tests/compliance/ -v -m audit
