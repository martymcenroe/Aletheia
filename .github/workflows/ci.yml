name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly compliance audit at midnight UTC
    - cron: '0 0 * * *'

jobs:
  # Dependency security review - runs on PRs only
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Allow licenses compatible with MIT
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense

  # Policy compliance runs FIRST - blocks all other jobs if failed
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run policy compliance check
        run: ./tools/policy_check.sh

  # Shell script linting - catch bash syntax errors before merge
  infra-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck on provision.sh
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          additional_files: 'provision.sh'

      - name: Run ShellCheck on tools/
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './tools'

  # DynamoDB integration tests - runs with DynamoDB Local service container
  # Issue #264: DynamoDB integration test infrastructure
  integration-tests:
    needs: policy-check
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Run DynamoDB integration tests
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
        run: |
          echo "=== DynamoDB Integration Tests ==="
          poetry run pytest tests/integration/ -v 2>&1 | tee integration_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if grep -qE "collected [0-9]+ item" integration_output.txt; then
            COLLECTED=$(grep -oE "collected [0-9]+ item" integration_output.txt | grep -oE "[0-9]+")
            echo "✓ Collected $COLLECTED integration tests"
          fi
          exit $EXIT_CODE

  test:
    needs: policy-check  # Only run if policy check passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Run linting
        run: |
          echo "=== Ruff Linting ==="
          OUTPUT=$(poetry run ruff check src/ tests/ 2>&1) || true
          echo "$OUTPUT"
          # Verify ruff actually processed files (look for file count or "All checks passed")
          if echo "$OUTPUT" | grep -qE "(All checks passed|[0-9]+ files? checked)"; then
            echo "✓ Ruff processed files successfully"
          elif echo "$OUTPUT" | grep -qE "^(src/|tests/)"; then
            echo "✓ Ruff found issues in files (will fail if errors)"
            poetry run ruff check src/ tests/
          else
            echo "✗ ERROR: Ruff produced no recognizable output - possible silent failure"
            echo "Output was: $OUTPUT"
            exit 1
          fi
          # Re-run to get actual exit code
          poetry run ruff check src/ tests/

      - name: Run type checking
        run: |
          echo "=== Mypy Type Checking ==="
          OUTPUT=$(poetry run mypy src/ --ignore-missing-imports 2>&1)
          echo "$OUTPUT"
          # Verify mypy actually checked files
          if echo "$OUTPUT" | grep -qE "Success|Found [0-9]+ error|no issues found"; then
            echo "✓ Mypy processed files successfully"
          else
            echo "✗ ERROR: Mypy produced no recognizable output - possible silent failure"
            exit 1
          fi

      - name: Run tests with coverage (excluding audit tests)
        run: |
          echo "=== Pytest ==="
          # Capture output to verify tests were collected
          poetry run pytest tests/ -v -m "not audit" --cov=src --cov-report=xml --cov-report=term-missing 2>&1 | tee pytest_output.txt
          # Verify tests were actually collected and run
          if grep -qE "collected [0-9]+ item" pytest_output.txt; then
            COLLECTED=$(grep -oE "collected [0-9]+ item" pytest_output.txt | grep -oE "[0-9]+")
            if [ "$COLLECTED" -gt 0 ]; then
              echo "✓ Pytest collected $COLLECTED tests"
            else
              echo "✗ ERROR: Pytest collected 0 tests - test discovery may be broken"
              exit 1
            fi
          else
            echo "✗ ERROR: Pytest output missing 'collected X items' - possible silent failure"
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  extension-lint:
    needs: policy-check  # Only run if policy check passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify ESLint security plugins installed
        run: |
          echo "=== ESLint Version ==="
          npx eslint --version
          echo ""
          echo "=== Installed ESLint Plugins ==="
          npm ls eslint-plugin-security eslint-plugin-no-unsanitized --depth=0
          echo ""
          echo "=== ESLint Config Validation ==="
          npx eslint --print-config extensions/chrome/popup.js | head -20

      - name: Lint Chrome extension
        run: |
          echo "=== ESLint Chrome Extension ==="
          # Run ESLint and capture output
          npx eslint extensions/chrome/ --format stylish 2>&1 | tee eslint_chrome.txt
          EXIT_CODE=${PIPESTATUS[0]}
          # Verify ESLint actually ran:
          # - Exit code 0 with empty output = clean (stylish format is silent on success)
          # - Exit code 0/1 with file paths or problem count = ran with results
          # - Exit code non-zero with no recognizable output = possible crash
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✓ ESLint processed Chrome extension files (clean)"
          elif grep -qE "\.js|\.mjs|[0-9]+ problems?" eslint_chrome.txt; then
            echo "✓ ESLint processed Chrome extension files (found issues)"
          else
            echo "✗ ERROR: ESLint produced no recognizable output - possible silent failure"
            cat eslint_chrome.txt
            exit 1
          fi
          exit $EXIT_CODE

      - name: Lint Firefox extension
        run: |
          echo "=== ESLint Firefox Extension ==="
          npx eslint extensions/firefox/ --format stylish 2>&1 | tee eslint_firefox.txt
          EXIT_CODE=${PIPESTATUS[0]}
          # Verify ESLint actually ran (same logic as Chrome)
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✓ ESLint processed Firefox extension files (clean)"
          elif grep -qE "\.js|\.mjs|[0-9]+ problems?" eslint_firefox.txt; then
            echo "✓ ESLint processed Firefox extension files (found issues)"
          else
            echo "✗ ERROR: ESLint produced no recognizable output - possible silent failure"
            cat eslint_firefox.txt
            exit 1
          fi
          exit $EXIT_CODE

      - name: Lint Firefox extension (web-ext)
        run: |
          echo "=== web-ext Lint ==="
          npx web-ext lint --source-dir extensions/firefox/ 2>&1 | tee webext_lint.txt
          EXIT_CODE=${PIPESTATUS[0]}
          # Verify web-ext actually ran (look for validation output)
          if grep -qE "Validation|linting|warnings?|errors?" webext_lint.txt; then
            echo "✓ web-ext lint processed extension"
          else
            echo "✗ ERROR: web-ext lint produced no recognizable output"
            cat webext_lint.txt
            exit 1
          fi
          exit $EXIT_CODE

  # Chrome E2E tests - BLOCKING gate for extension functionality
  # Issue #306: Ensures extension works in Chrome before merge
  e2e-chrome:
    needs: policy-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Cache Playwright binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Install Chromium OS dependencies
        run: npx playwright install-deps chromium

      - name: Run Chrome E2E tests
        # xvfb-run required for headed mode (extensions require headless: false)
        # --headed flag ensures headed mode regardless of config file state
        # --reporter=html ensures playwright-report/ is generated for artifact upload
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npx playwright test --project=chromium --headed --reporter=html

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-chrome
          path: playwright-report/
          retention-days: 7

  # Accessibility testing with pa11y (WCAG 2.0 AA)
  accessibility:
    needs: policy-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for pa11y
        run: npx puppeteer browsers install chrome

      - name: Start local server
        run: npx serve . -l 8080 &

      - name: Wait for server
        run: sleep 3

      - name: Run pa11y accessibility checks
        run: npm run test:a11y:ci

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pa11y-screenshots
          path: pa11y-screenshots/

  # Infrastructure deployment - runs ONLY on push to main
  deploy-infra:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, integration-tests, policy-check]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Deploy Infrastructure
        run: ./provision.sh

  # Post-deploy smoke test - verify API health after infrastructure deployment
  # Catches misconfigurations (e.g. AUTH_ENABLED=true before extension auth is ready)
  post-deploy-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://api.aletheia.study/health)
          echo "Health: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAIL: Health endpoint returned $HTTP_STATUS"
            exit 1
          fi

      - name: Analysis endpoint (AUTH_ENABLED=true expected)
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST https://api.aletheia.study/ \
            -H 'Content-Type: application/json' \
            -H 'X-Aletheia-Client-Version: 1.0' \
            -d '{"text":"smoke test"}')
          echo "Analysis: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "401" ]; then
            echo "OK: AUTH_ENABLED=true — unauthenticated request correctly rejected"
          elif [ "$HTTP_STATUS" = "200" ]; then
            echo "OK: Analysis endpoint responded successfully"
          else
            echo "FAIL: Unexpected status $HTTP_STATUS"
            exit 1
          fi

  # Compliance audit - runs on push to main AND nightly schedule
  # Requires AWS credentials to verify Bedrock configuration
  compliance-audit:
    if: github.event_name == 'push' || github.event_name == 'schedule'
    needs: policy-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.5

      - name: Install dependencies
        run: poetry install --no-interaction --with dev

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run compliance audit tests
        run: poetry run pytest tests/compliance/ -v -m audit
